# Automatiske oppdateringer av avhengigheter og GitHub Actions.
# Dependabot lager PR-er som CI-en sjekker automatisk før de vurderes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Samle små oppdateringer i én PR i stedet for én per pakke
      patch-og-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Major-oppgraderinger av utviklerverktøy krever migrering og bør gjøres
      # bevisst — ikke som ukentlig PR. Sikkerhetsfikser og små oppdateringer
      # kommer fortsatt, og major på next/react varsles som før.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
