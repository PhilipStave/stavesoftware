name: CI

# Sjekker koden før den havner i produksjon: lint, typer og et fullt bygg.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typesjekk
        run: npx tsc --noEmit

      - name: Bygg
        # Turbopack henter Google-fontene over nettet mens den bygger. Når
        # runneren ikke får kontakt, faller byggingen med «Can't resolve
        # @vercel/turbopack-next/internal/font/google/font». Det har skjedd to
        # ganger, begge uten at noe var galt med koden — neste commit gikk
        # grønn uten endringer. Ett nytt forsøk fjerner symptomet.
        #
        # Den ekte løsningen er å legge fontene i repoet og bruke
        # next/font/local, så byggingen ikke trenger nett i det hele tatt.
        run: npm run build || (echo "Byggingen feilet — prøver en gang til" && npm run build)
