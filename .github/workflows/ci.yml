name: CI

# Sjekker koden før den havner i produksjon: lint, typer og et fullt bygg.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typesjekk
        run: npx tsc --noEmit

      - name: Bygg
        run: npm run build
